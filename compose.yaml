# 開発環境：docker compose up で http://localhost:3000 が開く（PORT=3010 docker compose up のように、手元のポートを変えられる）
# Gemini のキーは web/.env.local に置く（マウントしたファイルを Next.js が読む。イメージには入れない）
services:
  web:
    build:
      context: .
      target: dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      # node_modules と .next はコンテナ側のものを使う（Mac 側と混ぜない）
      - node_modules:/app/node_modules
      - engine_node_modules:/app/engine/node_modules
      - web_node_modules:/app/web/node_modules
      - skill_node_modules:/app/skill/node_modules
      - web_next:/app/web/.next
    environment:
      # マウントしたフォルダでファイルの変更を確実に拾う
      WATCHPACK_POLLING: "true"
    # package.json が変わっていたらここで入れ直してから起動する
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

  # アーキテクチャ図を描く：docker compose run --rm diagrams
  # （profiles を付けているので、docker compose up では起動しない）
  diagrams:
    build: docs/architecture
    profiles: ["tools"]
    volumes:
      - .:/work
    command: python docs/architecture/architecture.py

volumes:
  node_modules:
  engine_node_modules:
  web_node_modules:
  skill_node_modules:
  web_next:
